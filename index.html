    .intro {

    .section-top {

      margin: 36px 0 24px;
      flex-wrap: wrap;

    .group-title h3 {
      font-size: 1.6rem;
      font-weight: 500;
      margin: 0;
      letter-spacing: -.5px;
    }

    .group-title > span {
      font-family: "Courier New", monospace;
      font-size: .75rem;
      letter-spacing: 1px;
      color: #586544;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .cards.executive {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    .card {
      min-width: 0;
    }

    .portrait {
      margin: 0;
      aspect-ratio: 4 / 3;
      position: relative;
      background: #d6d9cf;
      border: 1px solid #c5ccbc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    .card-content {
      padding-top: 23px;
    }

    .tag {
      font-family: "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 1px;
      color: #586544;
    }

    .card h3 {
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -.6px;
      margin: 12px 0;
    }

    .card h4 {
      font-size: 1.125rem;
      line-height: 1.4;
      font-weight: 600;
      margin: 22px 0 12px;
    }

    .card p {
      font-size: 16px;
      line-height: 1.65;
      color: #525b4f;
      margin: 0 0 25px;
    }

    .card p.full-name {

      line-height: 1.5;
      color: #596250;
      margin: 0 0 18px;

      flex-wrap: wrap;
      gap: 4px 20px;
      padding-top: 15px;
      border-top: 1px solid #c4cabc;
      font-family: "Courier New", monospace;
      font-size: 13px;
      color: #5c6656;

    .source-status a,

      align-items: center;
      gap: 8px;
      min-height: 44px;
      font-size: .875rem;
      text-decoration: underline;
      text-underline-offset: 4px;
      line-height: 1.5;

    .voting-context {

      margin-bottom: 30px;

      margin: 0 0 10px;
      font-weight: 500;
    }

    .voting-context p {

      line-height: 1.7;
      color: #525b4f;
      margin: 0;
    }

    .context-sources {

      gap: 4px 24px;
      flex-wrap: wrap;
      margin-top: 8px;
      color: #425331;
    }

    .vote {

      margin-top: 18px;
      padding: 16px 0 20px;
    }

    .vote > span {
      font-size: .75rem;

      letter-spacing: .75px;
      color: #5c6656;

    .vote p {

      margin: 8px 0;
      font-size: 1.125rem;
      line-height: 1.4;
    }

    .vote small {

      color: #5c6656;
      line-height: 1.5;
      display: block;
    }

    .photo-credit {

      line-height: 1.6;
      color: #5c6656;
      border-top: 1px solid #c4cabc;
      padding-top: 22px;
      margin: 38px 0 0;

    footer {

      margin: auto;
      padding: 35px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    footer p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 300px;
    }

    footer > span {
      font-family: "Courier New", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .footer-brand {
      font-size: 15px;
      letter-spacing: 1px;
      font-weight: 700;
      display: flex;
      gap: 20px;
      min-height: 44px;
    }

    .footer-brand span {
      color: var(--accent);
    }

    @media (min-width: 1600px) {
      .opening {
        padding-top: 35px;

    }

    @media (max-width: 1000px) {
      .intro {
        gap: 32px;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px 24px;
      }

      .section-heading {
        align-items: start;
        flex-direction: column;
        gap: 14px;
      }

      .section-heading p {
        max-width: none;
      }

      footer > span {
        display: none;
      }
    }

    @media (max-width: 850px) {
      .intro {
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
      }

        max-width: none;

        scroll-padding-top: 16px;

        flex-wrap: wrap;

      .brand {
        font-size: 1.375rem;
        flex-shrink: 0;

      .opening {
        padding: 20px 20px 36px;

        margin-top: 8px;

      .intro {
        margin-top: 28px;
        gap: 20px;

      h1 {
        font-size: clamp(2rem, 8.5vw, 3rem);
        letter-spacing: -1px;
        line-height: 1.12;
      }

      .intro-copy p,
      .intro-copy .secondary {
        font-size: 1rem;
        line-height: 1.65;
        margin-bottom: 12px;
      }

      .scroll-link {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 1rem;
        padding: 10px 0;
        margin-top: 16px;
      }

      .politicians {
        padding: 30px 20px 40px;
      }

      .section-top {
        flex-wrap: wrap;
        font-size: .75rem;
        line-height: 1.6;
        letter-spacing: .5px;
        gap: 6px 16px;
        padding-bottom: 14px;
      }

      .section-heading {
        margin-top: 23px;
        gap: 12px;
      }

      .section-heading h2 {
        font-size: clamp(1.875rem, 7.6vw, 2.75rem);
        line-height: 1.15;
        letter-spacing: -1px;
      }

      .section-heading p {
        font-size: 1rem;
        line-height: 1.5;
      }

      .draft-note {
        font-size: .875rem;
        line-height: 1.6;
        margin: 16px 0 26px;
      }

      .cards,
      .cards.executive {
        grid-template-columns: minmax(0, 1fr);
        gap: 32px;
      }

      .portrait {
        aspect-ratio: 4 / 3;
        border-radius: 6px;
      }

      .card-content {
        padding-top: 18px;
      }

      .tag {
        font-size: .75rem;
        letter-spacing: .5px;
        line-height: 1.6;
      }

      .card h3 {
        font-size: 1.5rem;
        line-height: 1.25;
        letter-spacing: -.4px;
        margin: 10px 0;
      }

      .card p {
        font-size: 1rem;
        line-height: 1.65;
        margin-bottom: 18px;
      }

      .source-status {
        font-size: .875rem;
        line-height: 1.5;
        padding-top: 13px;
        gap: 0 18px;
      }

      .group-title {
        margin-top: 28px;
        margin-bottom: 20px;
        padding-bottom: 12px;
      }

      .group-title h3 {
        font-size: 1.375rem;
      }

      .council-title {
        margin-top: 40px;
      }

      .vote {
        padding-bottom: 14px;
      }

      .voting-context {
        margin-bottom: 24px;
      }

      .photo-credit {
        margin-top: 30px;
      }

      footer {
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        align-items: start;
        flex-direction: column;
        gap: 10px;
      }

      .footer-brand {
        font-size: .875rem;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      footer p {
        font-size: .875rem;
        margin: 0;
        max-width: none;
      }
    }

    @media (max-width: 360px) {
      .header,
      .opening,
      .politicians,
      footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .header {
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
